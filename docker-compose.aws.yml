services:
  user-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env.aws}
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks:
      - smart-study

  study-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: study_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${STUDY_DB_PASSWORD:?Set STUDY_DB_PASSWORD in .env.aws}
    volumes:
      - study-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d study_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks:
      - smart-study

  quiz-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: quiz_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${QUIZ_DB_PASSWORD:?Set QUIZ_DB_PASSWORD in .env.aws}
    volumes:
      - quiz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quiz_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks:
      - smart-study

  user-service:
    image: ${DOCKERHUB_USER:-dineshjat18}/smart-study-user-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://user-postgres:5432/user_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env.aws}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.aws}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50.0 -Duser.timezone=UTC"
    depends_on:
      user-postgres:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || curl -sf http://localhost:8081/actuator/prometheus || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - smart-study

  study-service:
    image: ${DOCKERHUB_USER:-dineshjat18}/smart-study-study-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://study-postgres:5432/study_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${STUDY_DB_PASSWORD:?Set STUDY_DB_PASSWORD in .env.aws}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50.0 -Duser.timezone=UTC"
    depends_on:
      study-postgres:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || curl -sf http://localhost:8082/actuator/prometheus || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - smart-study

  quiz-service:
    image: ${DOCKERHUB_USER:-dineshjat18}/smart-study-quiz-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    volumes:
      - ./services/quiz-service/quiz-service-1.0.0.jar:/app/app.jar:ro
    environment:
      DB_URL: jdbc:postgresql://quiz-postgres:5432/quiz_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${QUIZ_DB_PASSWORD:?Set QUIZ_DB_PASSWORD in .env.aws}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-dummy-key-for-local-dev}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://studyplanneragent-resource.openai.azure.com/openai/v1}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50.0 -Duser.timezone=UTC"
    depends_on:
      quiz-postgres:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || curl -sf http://localhost:8083/actuator/prometheus || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - smart-study

  api-gateway:
    image: ${DOCKERHUB_USER:-dineshjat18}/smart-study-api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      USER_SERVICE_URL: http://user-service:8081
      STUDY_SERVICE_URL: http://study-service:8082
      QUIZ_SERVICE_URL: http://quiz-service:8083
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.aws}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50.0 -Duser.timezone=UTC"
    depends_on:
      user-service:
        condition: service_healthy
      study-service:
        condition: service_healthy
      quiz-service:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || curl -sf http://localhost:8080/actuator/prometheus || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - smart-study

  frontend:
    image: ${DOCKERHUB_USER:-dineshjat18}/smart-study-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smart-study

  nagios:
    image: jasonrivers/nagios:latest
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      NAGIOSADMIN_USER: ${NAGIOSADMIN_USER:-nagiosadmin}
      NAGIOSADMIN_PASS: ${NAGIOSADMIN_PASS:?Set NAGIOSADMIN_PASS in .env.aws}
      NAGIOS_TIMEZONE: ${NAGIOS_TIMEZONE:-UTC}
    volumes:
      - ./monitoring/nagios/conf.d:/opt/nagios/etc/conf.d:ro
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -u $${NAGIOSADMIN_USER:-nagiosadmin}:$${NAGIOSADMIN_PASS} http://127.0.0.1/nagios/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smart-study

volumes:
  user-postgres-data:
  study-postgres-data:
  quiz-postgres-data:

networks:
  smart-study:
    driver: bridge