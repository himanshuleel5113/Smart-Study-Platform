###############################################################################
# Smart Study Platform - Nagios Monitoring Configuration
###############################################################################

###############################################################################
# COMMAND DEFINITIONS
###############################################################################

define command {
    command_name    check_smartstudy_http
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$
}

define command {
    command_name    check_smartstudy_tcp
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$
}

###############################################################################
# HOSTGROUP DEFINITION
###############################################################################

define hostgroup {
    hostgroup_name  smart-study-platform
    alias           Smart Study Platform Microservices
    members         smart-study-frontend,api-gateway,user-service,study-service,quiz-service,user-postgres,study-postgres,quiz-postgres
}

###############################################################################
# HOST DEFINITIONS
###############################################################################

define host {
    use                     generic-host
    host_name               smart-study-frontend
    alias                   Frontend Web UI (Nginx)
    address                 frontend
    check_command           check_smartstudy_tcp!80
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
}

define host {
    use                     generic-host
    host_name               api-gateway
    alias                   Spring Cloud API Gateway
    address                 api-gateway
    check_command           check_smartstudy_tcp!8080
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
}

