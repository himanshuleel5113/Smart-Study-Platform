apiVersion: 1

groups:
  - orgId: 1
    name: smart-study-backend-availability
    folder: Smart Study
    interval: 1m
    rules:
      - uid: backend-service-down
        title: Backend service unavailable (up < 1 for 2m)
        condition: B
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'Backend service {{ $labels.job }} is unavailable'
          description: 'Prometheus reports up == 0 for service {{ $labels.job }} for more than 2 minutes. Check the service deployment and logs.'
        data:
          - refId: A
            relativeTimeRange:
              from: 90
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'up{job=~"api-gateway|user-service|study-service|quiz-service"}'
              instant: true
              intervalMs: 1000
              legendFormat: '{{ $labels.job }}'
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: threshold
